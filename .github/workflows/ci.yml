name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # The projects target .NET Framework 4.6.2, which needs Windows and its targeting pack
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Build
        run: dotnet build EightQueens.sln --configuration Release

      # Tests and coverage run in the next step, so skip them here
      - name: Code analysis
        shell: pwsh
        run: ./tools/analyze.ps1 -SkipTests

      - name: Test with coverage
        run: dotnet test EightQueens.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory TestResults

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
